<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Radarr Janitor</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --muted:#9aa4b2; --accent:#4c8dff; --err:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; width:320px; }
  h1 { font-size:18px; margin:0 0 18px; }
  label { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin:12px 0 5px; }
  input { width:100%; background:#0d1017; border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:9px 11px; }
  button { width:100%; margin-top:18px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px; font-weight:600; cursor:pointer; }
  .err { color:var(--err); font-size:13px; margin-top:12px; }
</style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <h1>🎬 Radarr Janitor</h1>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
